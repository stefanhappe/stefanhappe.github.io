<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stefan Happe</title>
<meta name="description" content="Stefan Happe – Website in Arbeit.">
<meta name="robots" content="noindex">
<style>
  :root {
    color-scheme: dark;
    --bg: #111315;
    --fg: #f2f3f4;
    --fg-muted: #9aa0a6;
  }

  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }

  html,
  body {
    height: 100%;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 2rem 1.25rem;
  }

  main {
    text-align: center;
    max-width: 30rem;
  }

  h1 {
    margin: 0;
    font-size: clamp(2rem, 9vw, 3.5rem);
    font-weight: 600;
    letter-spacing: 0.02em;
    line-height: 1.15;
  }

  p {
    margin: 0.85rem 0 0;
    font-size: clamp(0.95rem, 3.5vw, 1.125rem);
    font-weight: 400;
    color: var(--fg-muted);
  }
</style>
</head>
<body>
  <main>
    <h1>Stefan Happe</h1>
    <p>Website in Arbeit</p>
  </main>
</body>
</html>
